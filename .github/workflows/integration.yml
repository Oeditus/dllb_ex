name: Integration (dllb)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Allow manual triggers for debugging
  workflow_dispatch:

env:
  MIX_ENV: dllb

jobs:
  integration:
    name: Integration Tests (dllb instance)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '27'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # dllb's Cargo.toml references path dependencies at:
      #   joerl  = { path = "../../Rust/joerl/joerl" }
      #   marcli = { path = "../../Rust/marcli" }
      # We recreate the expected directory layout so the build succeeds.
      - name: Clone dllb and its path dependencies
        run: |
          mkdir -p /tmp/dllb-build/Oeditus /tmp/dllb-build/Rust
          git clone --depth 1 https://github.com/Oeditus/dllb.git \
            /tmp/dllb-build/Oeditus/dllb
          git clone --depth 1 https://github.com/am-kantox/joerl.git \
            /tmp/dllb-build/Rust/joerl
          git clone --depth 1 https://github.com/Oeditus/marcli-rust.git \
            /tmp/dllb-build/Rust/marcli

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/dllb-build/Oeditus/dllb/target
          key: ${{ runner.os }}-cargo-dllb-${{ hashFiles('/tmp/dllb-build/Oeditus/dllb/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dllb-

      - name: Build dllb-server
        working-directory: /tmp/dllb-build/Oeditus/dllb
        run: cargo build --release -p dllb-server

      - name: Start dllb-server
        run: |
          /tmp/dllb-build/Oeditus/dllb/target/release/dllb-server &
          echo "DLLB_PID=$!" >> "$GITHUB_ENV"

          # Wait until the TCP port is accepting connections
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 3009 2>/dev/null; then
              echo "dllb-server ready on :3009"
              break
            fi
            echo "Waiting for dllb-server... ($i/30)"
            sleep 1
          done

          nc -z 127.0.0.1 3009 || { echo "dllb-server failed to start"; exit 1; }
        env:
          DLLB_BIND: "127.0.0.1:3009"
          DLLB_PATH: "/tmp/dllb_ci.redb"
          RUST_LOG: "dllb_server=info"

      - name: Restore Mix dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-dllb-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-dllb-

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests against dllb
        run: mix test

      - name: Stop dllb-server
        if: always()
        run: |
          if [ -n "$DLLB_PID" ]; then
            kill "$DLLB_PID" 2>/dev/null || true
          fi
